name: pa-spacedock
services:
  api:
    image: galaxyeye88/spacedock-api:latest
    privileged: true
    env_file:
      - ./.env
    environment:
      - DAYTONA_API_URL=http://localhost:3000/api # Added for compatibility
      - SPACEDOCK_API_URL=http://localhost:3000/api
      - OIDC_ISSUER_BASE_URL=http://localhost:5556/dex
      - OIDC_CLIENT_ID=spacedock
      - OIDC_AUDIENCE=spacedock
    ports:
      - "3000:3000"
      - "3003:3003"
      - "4000:4000"
      - "6000:6000"
      - "5556:5556"
      - "5100:5100"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    # Needed for DinD, container will use tini as PID 1 to automatically clean up orphan processes.
    # https://chatgpt.com/share/68ac5d39-88c4-8008-907e-01bbb6710a8b
    init: true
    volumes:
      - pulsar_docker_data:/var/lib/docker

  runner:
    image: galaxyeye88/spacedock-runner:latest
    network_mode: service:api
    env_file:
      - ./.env
    privileged: true
    # Needed for DinD, container will use tini as PID 1 to automatically clean up orphan processes.
    # https://chatgpt.com/share/68ac5d39-88c4-8008-907e-01bbb6710a8b
    init: true
    volumes:
      - pulsar_docker_data:/var/lib/docker

  proxy:
    image: galaxyeye88/spacedock-proxy:latest
    network_mode: service:api
    env_file:
      - ./.env
    environment:
      - DAYTONA_API_URL=http://localhost:3000/api # Added for compatibility
      - SPACEDOCK_API_URL=http://localhost:3000/api
      - OIDC_DOMAIN=http://localhost:5556/dex
    volumes:
      - pulsar_docker_data:/var/lib/docker

  dex:
    image: dexidp/dex:v2.42.0
    volumes:
      - ./dex/config.yaml:/etc/dex/config.yaml
    command: ['dex', 'serve', '/etc/dex/config.yaml']
    network_mode: service:api
    env_file:
      - ./.env
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5556/dex/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  db:
    image: postgres:11.9
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-pass}
      - POSTGRES_USER=${POSTGRES_USER:-user}
      - POSTGRES_DB=${POSTGRES_DB:-spacedock}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d spacedock"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:9.2.0
    entrypoint: ['sh', '-c', 'chmod 600 /pgpass && exec /entrypoint.sh']
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-development@spacedock.io}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-pgadmin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    user: root
    volumes:
      - ./pgadmin4/servers.json:/pgadmin4/servers.json
      - ./pgadmin4/pgpass:/pgpass
    depends_on:
      - db
    ports:
      - 5050:5050

  redis:
    image: redis:latest

  registry-ui:
    image: joxit/docker-registry-ui:main
    restart: always
    environment:
      - SINGLE_REGISTRY=true
      - REGISTRY_TITLE=Docker Registry UI
      - DELETE_IMAGES=true
      - SHOW_CONTENT_DIGEST=true
      - NGINX_PROXY_PASS_URL=http://localhost:6000
      - SHOW_CATALOG_NB_TAGS=true
      - CATALOG_MIN_BRANCHES=1
      - CATALOG_MAX_BRANCHES=1
      - TAGLIST_PAGE_SIZE=100
      - REGISTRY_SECURED=false
      - CATALOG_ELEMENTS_LIMIT=1000
    network_mode: service:api

  registry:
    image: registry:2.8.2
    restart: always
    environment:
      REGISTRY_HTTP_HEADERS_Access-Control-Allow-Origin: '[http://registry-ui.example.com]'
      REGISTRY_HTTP_HEADERS_Access-Control-Allow-Methods: '[HEAD,GET,OPTIONS,DELETE]'
      REGISTRY_HTTP_HEADERS_Access-Control-Allow-Credentials: '[true]'
      REGISTRY_HTTP_HEADERS_Access-Control-Allow-Headers: '[Authorization,Accept,Cache-Control]'
      REGISTRY_HTTP_HEADERS_Access-Control-Expose-Headers: '[Docker-Content-Digest]'
      REGISTRY_STORAGE_DELETE_ENABLED: 'true'
      REGISTRY_HTTP_ADDR: localhost:6000
    volumes:
      - registry:/var/lib/registry
    network_mode: service:api

  maildev:
    image: maildev/maildev

  minio:
    image: minio/minio:latest
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
      - MINIO_IDENTITY_STS_EXPIRY="24h"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

  jaeger:
    image: jaegertracing/all-in-one:1.67.0

volumes:
  registry: {}
  minio_data: {}
  pulsar_docker_data: {}
